# One-command local stack: the app, MySQL, and Redis.
#
#   docker compose up --build
#
# The app waits for MySQL's healthcheck to pass before starting, so Flyway
# migrations always run against a database that's actually ready.

services:
  app:
    build: .
    environment:
      DB_URL: jdbc:mysql://mysql:3306/seat_booking?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: root
      REDIS_HOST: redis
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: seat_booking
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -proot"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
